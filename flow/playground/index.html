<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>流程设计器 · 开发预览</title>
  <style>
    body { margin: 0; background: var(--xh-bg-page); color: var(--xh-fg-default); }
    .page { display: grid; gap: var(--xh-space-4); max-inline-size: 80rem; margin-inline: auto; padding: var(--xh-space-4); }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--xh-space-3); margin-block: var(--xh-space-3); }
    .switch-label { display: inline-flex; align-items: center; gap: var(--xh-space-2); color: var(--xh-fg-muted); font-size: var(--xh-font-size-sm); }
    xh-flow-viewer, xh-flow-designer { block-size: 32rem; border: var(--xh-stroke-thin) solid var(--xh-border-default); border-radius: var(--xh-radius-md); }
    .log { min-block-size: 6rem; max-block-size: 10rem; overflow: auto; margin-block-start: var(--xh-space-3); padding: var(--xh-space-2); border: var(--xh-stroke-thin) solid var(--xh-border-subtle); border-radius: var(--xh-radius-md); color: var(--xh-fg-muted); font-family: var(--xh-font-family-mono); font-size: var(--xh-font-size-xs); white-space: pre-wrap; }
  </style>
</head>
<body>
  <main class="page">
    <xh-alert tone="warning">
      <div data-xh-part="root">
        <div data-xh-part="content">
          <div data-xh-part="title">这是开发预览，不是产品</div>
          <div data-xh-part="description">只用来查看流程查看器与设计器的当前进度。界面与接口都还会变，数据不会保存。</div>
        </div>
      </div>
    </xh-alert>

    <xh-tabs default-value="viewer">
      <div data-xh-part="root">
        <div data-xh-part="list" aria-label="预览内容">
          <button data-xh-part="trigger" value="viewer">查看器</button>
          <button data-xh-part="trigger" value="designer">设计器</button>
          <div data-xh-part="indicator"></div>
        </div>

        <div data-xh-part="content" value="viewer">
          <div class="bar">
            <xh-toolbar>
              <div data-xh-part="root" aria-label="查看器操作">
                <div data-xh-part="group">
                  <button data-xh-part="item" type="button" value="fit">适配</button>
                  <button data-xh-part="item" type="button" value="zoom-in">放大</button>
                  <button data-xh-part="item" type="button" value="zoom-out">缩小</button>
                  <button data-xh-part="item" type="button" value="actual">100%</button>
                </div>
                <div data-xh-part="separator"></div>
                <div data-xh-part="group">
                  <button data-xh-part="item" type="button" value="run">模拟运行下一步</button>
                  <button data-xh-part="item" type="button" value="highlight">高亮总经理分支</button>
                  <button data-xh-part="item" type="button" value="reset">清除状态</button>
                </div>
              </div>
            </xh-toolbar>
          </div>
          <xh-flow-viewer id="viewer"></xh-flow-viewer>
        </div>

        <div data-xh-part="content" value="designer">
          <div class="bar">
            <span class="switch-label">
              <xh-switch id="zh">
                <button data-xh-part="root" aria-label="中文语言包">
                  <span data-xh-part="thumb"></span>
                </button>
              </xh-switch>
              中文语言包 flowZhCN
            </span>
          </div>
          <xh-flow-designer id="designer"></xh-flow-designer>
          <div class="log" id="log" aria-live="polite"></div>
        </div>
      </div>
    </xh-tabs>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
